name: aicrm-java
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: core_platform
      POSTGRES_USER: core_admin
      AICRM_DB_PASSWORD: ${AICRM_DB_PASSWORD:?Set AICRM_DB_PASSWORD in .env}
      POSTGRES_PASSWORD: ${AICRM_POSTGRES_PASSWORD:?Set AICRM_POSTGRES_PASSWORD in .env}
    volumes:
      - "core_pgdata:/var/lib/postgresql/data"
      - "./deploy/postgres:/docker-entrypoint-initdb.d:ro"
    ports: ["127.0.0.1:55437:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U core_admin -d core_platform"], interval: 5s, timeout: 3s, retries: 20}
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/core_platform
      DB_USER: core_app
      DB_PASSWORD: ${AICRM_DB_PASSWORD:?Set AICRM_DB_PASSWORD in .env}
      DB_MIGRATION_USER: core_admin
      DB_MIGRATION_PASSWORD: ${AICRM_POSTGRES_PASSWORD:?Set AICRM_POSTGRES_PASSWORD in .env}
      SPRING_PROFILES_ACTIVE: local
      CORE_BOOTSTRAP_ADMIN_PASSWORD: ${AICRM_BOOTSTRAP_PASSWORD:?Set AICRM_BOOTSTRAP_PASSWORD in .env}
      CORE_BOOTSTRAP_MFA_CODE: "123456"
      CORE_MFA_ENABLED: "false"
      CORE_MFA_REQUIRE_ADMIN: "false"
      CORE_MFA_ALLOW_BOOTSTRAP: "false"
      CORE_OUTBOX_ENABLED: "true"
      CORE_JOBS_ENABLED: "true"
      CORE_JOBS_SCHEDULER_ENABLED: "true"
    ports: ["127.0.0.1:8185:8080"]
    volumes: ["core_fileroot:/data/files"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck: {test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"], interval: 10s, timeout: 3s, retries: 12}
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_CORE_API_URL: ${NEXT_PUBLIC_CORE_API_URL:-http://localhost:8185}
    restart: unless-stopped
    ports: ["127.0.0.1:3205:3000"]
    depends_on:
      backend: {condition: service_healthy}
volumes: {core_pgdata: {}, core_fileroot: {}}
