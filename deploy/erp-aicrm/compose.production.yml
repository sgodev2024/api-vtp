services:
  postgres:
    ports: !override []
    mem_limit: 512m
  backend:
    build:
      dockerfile: ../deploy/erp-aicrm/backend.Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: production
      CORE_CORS_ALLOWED_ORIGINS: https://erp.aicrm.vn
      DB_POOL_SIZE: "10"
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m"
    mem_limit: 768m
  frontend:
    mem_limit: 512m
